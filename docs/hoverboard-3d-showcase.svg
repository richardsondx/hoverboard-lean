<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="A teal hoverboard with a rider floating over a grid of red and blue magnets, with field lines arcing up to the board and a small U of x curve with its minimum at zero">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2440"/>
      <stop offset="1" stop-color="#123f5e"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#sky)"/>
  <text x="60" y="70" font-family="sans-serif" font-size="44" font-weight="bold" fill="#ffffff">Diamagnetic hoverboard, floating</text>
  <text x="60" y="112" font-family="sans-serif" font-size="24" fill="#cfe8ef">A board over a magnet array, pushed sideways, settling back to centre</text>
  <rect x="40" y="470" width="760" height="140" rx="14" fill="#0a1a2c"/>
  <g font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">
    <g>
      <rect x="80" y="500" width="86" height="70" rx="8" fill="#dc2626"/><text x="123" y="545" fill="#ffffff">N</text>
      <rect x="180" y="500" width="86" height="70" rx="8" fill="#2563eb"/><text x="223" y="545" fill="#ffffff">S</text>
      <rect x="280" y="500" width="86" height="70" rx="8" fill="#dc2626"/><text x="323" y="545" fill="#ffffff">N</text>
      <rect x="380" y="500" width="86" height="70" rx="8" fill="#2563eb"/><text x="423" y="545" fill="#ffffff">S</text>
      <rect x="480" y="500" width="86" height="70" rx="8" fill="#dc2626"/><text x="523" y="545" fill="#ffffff">N</text>
      <rect x="580" y="500" width="86" height="70" rx="8" fill="#2563eb"/><text x="623" y="545" fill="#ffffff">S</text>
      <rect x="680" y="500" width="86" height="70" rx="8" fill="#dc2626"/><text x="723" y="545" fill="#ffffff">N</text>
    </g>
  </g>
  <text x="420" y="600" font-family="sans-serif" font-size="20" fill="#9fb8c8" text-anchor="middle">Magnet array, 7 by 3, red N and blue S</text>
  <g stroke="#7dd3fc" stroke-width="3" fill="none" opacity="0.85">
    <path d="M 120 500 Q 200 340 300 360"/>
    <path d="M 320 500 Q 400 320 500 360"/>
    <path d="M 520 500 Q 600 320 700 360"/>
    <path d="M 220 500 Q 300 380 420 360"/>
    <path d="M 620 500 Q 520 380 420 360"/>
  </g>
  <g>
    <rect x="280" y="330" width="340" height="34" rx="17" fill="url(#board)"/>
    <rect x="300" y="364" width="300" height="10" rx="5" fill="#0f766e"/>
    <circle cx="450" cy="300" r="22" fill="#fbbf24"/>
    <rect x="430" y="318" width="40" height="18" rx="6" fill="#f8fafc"/>
    <rect x="380" y="270" width="140" height="14" rx="7" fill="#f8fafc" transform="rotate(-12 450 277)"/>
  </g>
  <g font-family="sans-serif" font-size="22" fill="#ffffff">
    <text x="650" y="310">Lift</text>
    <text x="650" y="390">Gravity</text>
  </g>
  <g stroke-width="5" fill="none">
    <line x1="640" y1="330" x2="640" y2="280" stroke="#4ade80" marker-end="url(#a)"/>
    <line x1="640" y1="370" x2="640" y2="420" stroke="#f87171"/>
  </g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/></marker></defs>
  <rect x="860" y="470" width="300" height="140" rx="14" fill="#ffffff"/>
  <text x="1010" y="500" font-family="sans-serif" font-size="22" font-weight="bold" fill="#0b2440" text-anchor="middle">U(x) = x squared + 1</text>
  <path d="M 890 590 Q 1010 490 1130 590" stroke="#0d9488" stroke-width="5" fill="none"/>
  <circle cx="1010" cy="560" r="7" fill="#dc2626"/>
  <text x="1010" y="600" font-family="sans-serif" font-size="18" fill="#0b2440" text-anchor="middle">Minimum at 0</text>
  <text x="60" y="670" font-family="sans-serif" font-size="20" fill="#cfe8ef">Interactive 3D version: move the sliders, push the board, watch it settle back.</text>
</svg>
